<html>

    <script language="JavaScript">
    function escreverArquivo() {  
    
        var fso  = new ActiveXObject("Scripting.FileSystemObject");

        fh.WriteLine("Tentativa de criar .txt 1");
    
        fh.Close(); 
    
    }

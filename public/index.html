<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--<link rel="stylesheet" href="./css/reset.css">-->
    <link rel="stylesheet" href="./css/card.css">
    <title>Monitor Temperatura</title>
  </head>
  <body>
    <div class="card-container">
          <img class="hero-image" src="./img/Infra.jpg" alt="Imagem ilustrativa de infravermelho"/>
        <main class="main-content">
          <div id="tempPrincipal">
            <h1>Temperatura:</h1>
            <div id="temp"></div>
          </div>
          <span>Temperatura máxima:</span>
          <div id="tempMax"></div>
          <span>Temperatura mínima:</span>
          <div id="tempMin"></div>
          <div class="flex-row">
            <div class="coin-base">
              <h2>Última medição:</h2>
            </div>
            <div class="time-left">
              <img src="./img/clock-selection-no-bg.png" alt="clock" class="small-image"/>
              <div id="tempo"></div>
            </div>
          </div>
        </main>
      </div>
  </div>
  <script type="module" src="./js/index.js"></script>
  </body>
</html>
